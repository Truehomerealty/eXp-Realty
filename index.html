<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoInvestment Real Estate</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f6f3ed;
  color: #171717;
}

header {
  background: #111;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

.logo span {
  color: #c9a227;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 18px;
  font-size: 14px;
}

.hero {
  min-height: 520px;
  padding: 90px 7%;
  color: white;
  display: flex;
  align-items: center;

  background:
    linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.58)),
    url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1600&q=80")
    center/cover;
}

.hero-content {
  max-width: 650px;
}

.hero h1 {
  font-size: 48px;
  margin-bottom: 18px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 28px;
}

.btn {
  display: inline-block;
  padding: 13px 23px;
  background: #c9a227;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

section {
  padding: 60px 7%;
}

.section-title {
  text-align: center;
  margin-bottom: 35px;
}

.section-title h2 {
  font-size: 32px;
  margin-bottom: 8px;
}

.properties {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.property {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(0,0,0,.1);
}

.property img {
  width: 100%;
  height: 210px;
  object-fit: cover;
}

.property-info {
  padding: 20px;
}

.property-info h3 {
  margin-bottom: 8px;
}

.location {
  color: #777;
  margin-bottom: 8px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0;
}

.account {
  background: #111;
  color: white;
  text-align: center;
}

.account-box {
  max-width: 500px;
  margin: auto;
}

.account-box p {
  margin: 15px 0 25px;
}

.contact {
  text-align: center;
}

footer {
  background: #080808;
  color: #aaa;
  text-align: center;
  padding: 25px;
}

@media(max-width:600px) {
  header {
    flex-direction: column;
    gap: 12px;
  }

  nav a {
    margin: 0 6px;
  }

  .hero h1 {
    font-size: 36px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Go<span>Investment</span></div>

  <nav>
    <a href="#properties">Properties</a>
    <a href="#account">Sign In</
